{% extends "base.html" %}
{% block title %}Новый пароль — Vibe{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h1 class="fw-bold mb-4 text-center">Новый пароль</h1>
      <p class="text-light-50 text-center small">
        Код отправлен на
        {% if channel == 'email' %}{{ email }}{% else %}{{ phone }}{% endif %}.
        В демо-режиме код смотрите в консоли сервера.
      </p>
      <form method="post" class="card p-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Код из сообщения</label>
          <input type="text" name="code" class="form-control text-center"
                 maxlength="5" pattern="[0-9]{5}" inputmode="numeric"
                 style="font-size:1.5rem;letter-spacing:.5rem;" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Новый пароль</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Повторите пароль</label>
          <input type="password" name="password2" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-brand w-100">Сохранить пароль</button>
      </form>
    </div>
  </div>
{% endblock %}
