{% extends "base.html" %}
{% block title %}Вход — Vibe{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h1 class="fw-bold mb-4 text-center">Вход в Vibe</h1>
      <form method="post" class="card p-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">E-mail или телефон</label>
          <input type="text" name="login" class="form-control"
                 value="{{ login or '' }}" required autofocus
                 placeholder="you@example.com или +7 900 000-00-00">
        </div>
        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-brand w-100">Войти</button>
        <div class="d-flex justify-content-between mt-3 small">
          <a href="{{ url_for('auth.forgot') }}">Забыли пароль?</a>
          <a href="{{ url_for('auth.register') }}">Регистрация</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
