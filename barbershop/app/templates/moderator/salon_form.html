{% extends "base.html" %}
{% block title %}Данные салона{% endblock %}
{% block content %}
  <h1 class="fw-bold mb-4">Данные салона</h1>
  <form method="post" enctype="multipart/form-data" class="col-md-7">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="mb-3">
      <label class="form-label">Название</label>
      <input type="text" name="name" class="form-control" value="{{ salon.name }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Город</label>
      <select name="city_id" class="form-select">
        <option value="">— не указан —</option>
        {% for r in regions %}
          <optgroup label="{{ r.name }}">
            {% for c in r.cities %}
              <option value="{{ c.id }}"
                {% if salon.city_id == c.id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
          </optgroup>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Адрес</label>
      <input type="text" name="address" class="form-control" value="{{ salon.address }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Телефон</label>
      <input type="text" name="phone" class="form-control" value="{{ salon.phone or '' }}">
    </div>

    <div class="row">
      <div class="col-6 mb-3">
        <label class="form-label">Широта</label>
        <input type="text" name="latitude" class="form-control"
               value="{{ salon.latitude or '' }}" placeholder="55.7558">
      </div>
      <div class="col-6 mb-3">
        <label class="form-label">Долгота</label>
        <input type="text" name="longitude" class="form-control"
               value="{{ salon.longitude or '' }}" placeholder="37.6173">
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Ссылка на обложку (необязательно)</label>
      <input type="text" name="photo_url" class="form-control"
             value="{{ salon.photo_url or '' }}">
    </div>

    <div class="mb-3">
      <label class="form-label">Загрузить фотографии</label>
      <input type="file" name="photos" class="form-control"
             multiple accept="image/png,image/jpeg,image/webp,image/gif">
    </div>

    {% if salon.photos %}
      <div class="mb-3">
        <label class="form-label">Текущие фотографии</label>
        <div class="photo-gallery">
          {% for p in salon.photos %}
            <div style="position:relative;">
              <img src="{{ p.src }}" alt="" onclick="window.open(this.src, '_blank')">
              <form method="post"
                    action="{{ url_for('moderator.salon_photo_delete', photo_id=p.id) }}"
                    style="position:absolute;top:6px;right:6px;"
                    onsubmit="return confirm('Удалить это фото?');">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="btn btn-sm btn-danger">×</button>
              </form>
            </div>
          {% endfor %}
        </div>
      </div>
    {% endif %}

    <div class="mb-3">
      <label class="form-label">Описание</label>
      <textarea name="description" class="form-control"
                rows="3">{{ salon.description or '' }}</textarea>
    </div>

    <button type="submit" class="btn btn-brand">Сохранить</button>
    <a href="{{ url_for('moderator.dashboard') }}" class="btn btn-outline-secondary">Отмена</a>
  </form>
{% endblock %}
