{% extends "base.html" %}
{% block title %}Восстановление пароля — Vibe{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h1 class="fw-bold mb-4 text-center">Восстановление пароля</h1>
      <form method="post" class="card p-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">E-mail или телефон</label>
          <input type="text" name="login" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Куда отправить код</label>
          <select name="channel" class="form-select">
            <option value="email">На e-mail</option>
            <option value="phone">На телефон</option>
          </select>
        </div>
        <button type="submit" class="btn btn-brand w-100">Отправить код</button>
        <p class="text-center mt-3 mb-0 small">
          <a href="{{ url_for('auth.login') }}">Вернуться ко входу</a>
        </p>
      </form>
    </div>
  </div>
{% endblock %}
