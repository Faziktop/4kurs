{% extends "base.html" %}
{% block title %}Редактирование профиля — Vibe{% endblock %}
{% block content %}
  <h1 class="fw-bold mb-4">Редактирование профиля</h1>
  <form method="post" class="col-md-6">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Имя</label>
      <input type="text" name="full_name" class="form-control"
             value="{{ current_user.full_name }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">E-mail</label>
      <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
    </div>
    <div class="mb-3">
      <label class="form-label">Телефон</label>
      <input type="text" name="phone" class="form-control"
             value="{{ current_user.phone or '' }}">
      <div class="form-text text-light-50">
        При смене номера потребуется повторное подтверждение.
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Новый пароль (необязательно)</label>
      <input type="password" name="password" class="form-control"
             placeholder="Оставьте пустым, чтобы не менять">
    </div>
    <button type="submit" class="btn btn-brand">Сохранить</button>
    <a href="{{ url_for('main.profile') }}" class="btn btn-outline-secondary">Отмена</a>
  </form>
{% endblock %}
