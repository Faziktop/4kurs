{% extends "base.html" %}
{% block title %}Регистрация — Vibe{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h1 class="fw-bold mb-4 text-center">Регистрация в Vibe</h1>
      <form method="post" class="card p-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Имя</label>
          <input type="text" name="full_name" class="form-control"
                 value="{{ full_name or '' }}" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" name="email" class="form-control"
                 value="{{ email or '' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Телефон (обязательно)</label>
          <input type="tel" name="phone" class="form-control"
                 value="{{ phone or '' }}" placeholder="+7 900 000-00-00" required>
          <div class="form-text text-light-50">На этот номер придёт 5-значный код.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Повторите пароль</label>
          <input type="password" name="password2" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-brand w-100">Зарегистрироваться</button>
        <p class="text-center mt-3 mb-0 small text-light-50">
          Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войти</a>
        </p>
      </form>
    </div>
  </div>
{% endblock %}
