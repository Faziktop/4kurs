{% extends "base.html" %}
{% block title %}Подтверждение номера — Vibe{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h1 class="fw-bold mb-4 text-center">Подтверждение номера</h1>
      <p class="text-light-50 text-center">
        Мы отправили 5-значный код на номер <strong>{{ phone }}</strong>.
      </p>
      <p class="text-light-50 text-center small">
        В демо-режиме код печатается в консоли сервера.
      </p>

      <form method="post" class="card p-4 mb-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Код из SMS</label>
          <input type="text" name="code" class="form-control text-center"
                 maxlength="5" pattern="[0-9]{5}" inputmode="numeric"
                 required autofocus
                 style="font-size:1.5rem;letter-spacing:.5rem;">
        </div>
        <button type="submit" class="btn btn-brand w-100">Подтвердить</button>
      </form>

      <form method="post" action="{{ url_for('auth.send_code_again') }}" class="text-center">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-outline-secondary btn-sm">Отправить код повторно</button>
      </form>
    </div>
  </div>
{% endblock %}
